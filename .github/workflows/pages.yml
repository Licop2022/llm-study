name: Publish learning workspace
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Stage site without repository metadata
        run: |
          mkdir -p /tmp/learning-site
          tar --exclude='./.git' --exclude='./.github' --exclude='./.gitignore' --exclude='./README.md' -cf - . | tar -xf - -C /tmp/learning-site
      - uses: actions/upload-pages-artifact@v4
        with:
          path: /tmp/learning-site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
